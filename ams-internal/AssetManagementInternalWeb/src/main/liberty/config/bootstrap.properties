# Bootstrap properties, resolved before server.xml is read.
#
# The datasource and keystore values used to be declared here as ${env.X} placeholders. They have
# moved to <variable defaultValue="..."/> elements in server.xml, which is strictly better: Liberty
# maps an environment variable onto a variable of the same name (AMS_DATASOURCE_URL -> the variable
# ams.datasource.url), so a deployment still overrides every one of them from the environment, and
# a bare checkout now starts with no environment exported at all.
#
# Declaring them here as well would defeat that - an unset ${env.X} resolves to the literal string
# rather than to nothing, and would win over the default.

com.ibm.ws.logging.console.format=simple
com.ibm.ws.logging.console.log.level=INFO
com.ibm.ws.logging.message.file.name=messages.log
